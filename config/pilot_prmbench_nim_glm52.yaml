experiment_name: "nim_glm52_robustness"
seed: 20260828

paths:
  source_rows: data/source/prmbench_rows.jsonl
  source_manifest: data/source/prmbench_manifest.json

  main_conditions: data/processed/pilot_conditions_16k.jsonl
  main_validation_report: data/processed/main_validation_report_nim_glm52.json

  prompt_template: config/prompts/pairwise_judge.txt

  subset_manifest: artifacts/nim_16k_subset_manifest.json
  freeze_manifest: artifacts/nim_glm52_freeze_manifest.json
  preflight_report: results/nim/glm52/preflight.json
  attempt_counter: results/nim/glm52/api_attempt_counter.json

  runs_dir: results/nim/glm52/raw
  results_dir: results/nim/glm52/paper

tokenizer: CohereLabs/command-a-plus-05-2026-w4a4

lengths:
  16K:
    target: 16000
    min: 15200
    max: 16800

positions:
  early:  {target: 0.15, min: 0.10, max: 0.20}
  middle: {target: 0.50, min: 0.45, max: 0.55}
  late:   {target: 0.85, min: 0.80, max: 0.90}

judge:
  provider: "nvidia_nim"
  model: "z-ai/glm-5.2"
  temperature: 0.0
  max_tokens: 16384
  stream: true

scheduler:
  max_concurrency: 1
  minimum_interval_seconds: 60
  max_transport_retries: 2
  base_backoff_seconds: 120
  hard_attempt_cap: 300
